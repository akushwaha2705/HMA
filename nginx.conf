# nginx.conf (replace existing)

# HTTP: handle ACME challenge and redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name academygpt.fleetstudio.com;

    # ACME challenge webroot (certbot uses this)
    location ~ ^/\.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # redirect everything else to https
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server: serve static files and proxy other requests to the app container
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name academygpt.fleetstudio.com;

    ssl_certificate /etc/letsencrypt/live/academygpt.fleetstudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/academygpt.fleetstudio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 20M;

    # Serve static files from shared volume mounted at /app/staticfiles
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri $uri/ =404;
    }

    # Proxy requests to the app container (use docker-compose service name)
    location / {
        proxy_pass http://fsai:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffers 16 4k;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_redirect off;
    }

    # optional health endpoint proxy
    location /healthz {
        proxy_pass http://fsai:8000/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}